<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ŞERİT KAÇIŞI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F19;
    --bg-elev:#131826;
    --asphalt:#20263A;
    --asphalt-2:#262d44;
    --lane:#F4C430;
    --accent:#FF3D68;
    --accent-2:#37E6C4;
    --text:#F5F5F0;
    --text-dim:#8A93A6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Rajdhani',sans-serif; color:var(--text);}
  #app{position:relative; width:100vw; height:100vh; overflow:hidden;}
  canvas{display:block; width:100%; height:100%;}

  .hidden{display:none !important;}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:16px 20px; pointer-events:none;
    font-family:'Orbitron',sans-serif;
  }
  .hud-block{
    background:rgba(11,15,25,0.55);
    border:1px solid rgba(244,196,48,0.25);
    border-radius:8px;
    padding:8px 14px;
    backdrop-filter: blur(3px);
  }
  .hud-label{font-size:10px; letter-spacing:2px; color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-weight:600;}
  .hud-value{font-size:20px; font-weight:700; color:var(--accent-2);}
  .hud-value.speed{color:var(--accent);}
  #hud-name{color:var(--lane); font-size:13px; font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:1px;}

  /* ---------- Overlays (menu / gameover) ---------- */
  .overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, rgba(38,45,68,0.85), rgba(11,15,25,0.96));
    z-index:10;
  }
  .card{
    width:min(420px, 88vw);
    background:var(--bg-elev);
    border:1px solid rgba(55,230,196,0.18);
    border-radius:14px;
    padding:28px 26px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(244,196,48,0.06) inset;
  }
  .eyebrow{
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:4px; color:var(--accent-2);
    margin:0 0 6px;
  }
  h1{
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:28px; margin:0 0 4px;
    color:var(--text); letter-spacing:1px;
    text-shadow:0 0 18px rgba(255,61,104,0.35);
  }
  .sub{color:var(--text-dim); font-size:14px; margin:0 0 22px; line-height:1.5;}

  label.field-label{display:block; font-size:12px; letter-spacing:2px; color:var(--text-dim); font-weight:700; margin-bottom:8px; text-transform:uppercase;}
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid #333c56;
    background:#0F1420; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:600;
    outline:none; margin-bottom:20px;
  }
  input[type=text]:focus{border-color:var(--accent-2);}

  .diff-row{display:flex; gap:8px; margin-bottom:26px;}
  .diff-btn{
    flex:1; padding:10px 6px; border-radius:8px; border:1px solid #333c56; background:#0F1420;
    color:var(--text-dim); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px;
    cursor:pointer; transition:all .15s ease; letter-spacing:1px;
  }
  .diff-btn.active{ border-color:var(--accent); color:var(--text); background:rgba(255,61,104,0.12); box-shadow:0 0 0 1px var(--accent) inset;}
  .diff-btn:hover{color:var(--text);}

  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:8px; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), #ff6b8f);
    color:#160308; font-family:'Orbitron',sans-serif; font-weight:700; font-size:14px; letter-spacing:2px;
    box-shadow:0 8px 24px rgba(255,61,104,0.35);
    transition:transform .1s ease;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed; box-shadow:none;}

  .btn-ghost{
    width:100%; padding:12px; margin-top:10px; border-radius:8px; cursor:pointer;
    background:transparent; border:1px solid #333c56; color:var(--text-dim);
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:1px;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--accent-2);}

  .crash-title{
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:26px; color:var(--accent);
    text-align:center; margin:0 0 4px; text-shadow:0 0 20px rgba(255,61,104,0.5);
  }
  .crash-sub{text-align:center; color:var(--text-dim); margin:0 0 20px; font-size:13px;}

  .stat-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px dashed #2a3149;}
  .stat-row:last-of-type{border-bottom:none;}
  .stat-key{color:var(--text-dim); font-size:13px; font-weight:600; letter-spacing:1px;}
  .stat-val{font-family:'Orbitron',sans-serif; color:var(--accent-2); font-weight:700; font-size:16px;}

  #leaderboard{margin-top:18px;}
  .lb-title{font-size:11px; letter-spacing:3px; color:var(--text-dim); font-weight:700; margin-bottom:8px;}
  .lb-item{display:flex; justify-content:space-between; padding:6px 10px; border-radius:6px; font-size:13px; font-weight:600;}
  .lb-item.me{background:rgba(244,196,48,0.12); color:var(--lane);}
  .lb-item span:first-child{color:inherit; opacity:0.85;}

  /* ---------- Touch controls ---------- */
  #touch-controls{
    position:absolute; bottom:22px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 22px; z-index:5;
    pointer-events:none;
  }
  .touch-btn{
    pointer-events:all;
    width:64px; height:64px; border-radius:50%;
    background:rgba(38,45,68,0.55); border:1px solid rgba(244,196,48,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color:var(--lane); user-select:none;
    backdrop-filter: blur(2px);
  }
  .touch-btn:active{background:rgba(255,61,104,0.35);}

  @media (min-width: 820px){
    #touch-controls{display:none;}
  }

  .footer-hint{
    position:absolute; bottom:10px; left:0; right:0; text-align:center;
    color:var(--text-dim); font-size:11px; letter-spacing:1px; z-index:4; pointer-events:none;
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-block">
      <div class="hud-label">SÜRÜCÜ</div>
      <div id="hud-name">—</div>
    </div>
    <div class="hud-block" style="text-align:center;">
      <div class="hud-label">MESAFE</div>
      <div class="hud-value" id="hud-distance">0 m</div>
    </div>
    <div class="hud-block" style="text-align:right;">
      <div class="hud-label">HIZ</div>
      <div class="hud-value speed" id="hud-speed">0 km/s</div>
    </div>
  </div>

  <!-- MENU -->
  <div id="menu-screen" class="overlay">
    <div class="card">
      <p class="eyebrow">ŞERİT KAÇIŞI // SONSUZ PİST</p>
      <h1>Yarışa Hazır mısın?</h1>
      <p class="sub">Solla, geç, sıyır. Yol dümdüz ama trafik seni asla rahat bırakmaz. Çarpana kadar devam eder.</p>

      <label class="field-label">İsmin</label>
      <input type="text" id="name-input" maxlength="14" placeholder="Örn: Şimşek" autocomplete="off">

      <label class="field-label">Zorluk</label>
      <div class="diff-row" id="diff-row">
        <button class="diff-btn active" data-diff="kolay">KOLAY</button>
        <button class="diff-btn" data-diff="orta">ORTA</button>
        <button class="diff-btn" data-diff="zor">ZOR</button>
      </div>

      <button class="btn-primary" id="start-btn">MOTORU ÇALIŞTIR</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-screen" class="overlay hidden">
    <div class="card">
      <p class="crash-title">ÇARPTIN!</p>
      <p class="crash-sub" id="crash-name-sub">—</p>

      <div class="stat-row"><span class="stat-key">MESAFE</span><span class="stat-val" id="final-distance">0 m</span></div>
      <div class="stat-row"><span class="stat-key">SOLLAMA</span><span class="stat-val" id="final-overtakes">0</span></div>
      <div class="stat-row"><span class="stat-key">SKOR</span><span class="stat-val" id="final-score">0</span></div>

      <div id="leaderboard">
        <div class="lb-title">EN İYİ SKORLAR (BU OTURUM)</div>
        <div id="lb-list"></div>
      </div>

      <button class="btn-primary" id="retry-btn" style="margin-top:20px;">TEKRAR DENE</button>
      <button class="btn-ghost" id="menu-btn">ANA MENÜYE DÖN</button>
    </div>
  </div>

  <div id="touch-controls" class="hidden">
    <div class="touch-btn" id="touch-left">◀</div>
    <div class="touch-btn" id="touch-right">▶</div>
  </div>
  <div class="footer-hint hidden" id="footer-hint">◀ ▶ ya da A / D ile şerit değiştir</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Difficulty presets ----------
  const DIFFS = {
    kolay: { spawnInterval: 1450, botSpeedFactor: 0.52, speedRamp: 0.0016, baseSpeed: 150, label:'KOLAY' },
    orta:  { spawnInterval: 1050, botSpeedFactor: 0.62, speedRamp: 0.0022, baseSpeed: 175, label:'ORTA' },
    zor:   { spawnInterval: 720,  botSpeedFactor: 0.72, speedRamp: 0.0030, baseSpeed: 200, label:'ZOR' },
  };

  const LANES = 3;
  let laneCenters = [];
  let roadLeft, roadRight, roadWidth;

  function computeRoad(){
    roadWidth = Math.min(W * 0.62, 520);
    roadLeft = (W - roadWidth) / 2;
    roadRight = roadLeft + roadWidth;
    laneCenters = [];
    const laneW = roadWidth / LANES;
    for(let i=0;i<LANES;i++){
      laneCenters.push(roadLeft + laneW*i + laneW/2);
    }
  }
  computeRoad();
  window.addEventListener('resize', computeRoad);

  // ---------- State ----------
  let state = 'menu'; // menu | playing | gameover
  let playerName = '';
  let difficultyKey = 'kolay';
  let diff = DIFFS[difficultyKey];

  const carW = () => Math.min(roadWidth/LANES * 0.62, 56);
  const carH = () => carW() * 1.7;

  let player, bots, distance, overtakes, speed, scrollY, spawnTimer, elapsedMs;
  let sessionBoard = [];

  function resetGame(){
    computeRoad();
    player = {
      lane: 1,
      x: laneCenters[1],
      targetX: laneCenters[1],
      y: 0,
      color: '#37E6C4'
    };
    player.y = H * 0.78;
    bots = [];
    distance = 0;
    overtakes = 0;
    speed = diff.baseSpeed;
    scrollY = 0;
    spawnTimer = 0;
    elapsedMs = 0;
  }

  // ---------- Input ----------
  function moveLeft(){
    if(state !== 'playing') return;
    player.lane = Math.max(0, player.lane - 1);
    player.targetX = laneCenters[player.lane];
  }
  function moveRight(){
    if(state !== 'playing') return;
    player.lane = Math.min(LANES-1, player.lane + 1);
    player.targetX = laneCenters[player.lane];
  }
  window.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)) moveLeft();
    if(['ArrowRight','d','D'].includes(e.key)) moveRight();
  });
  document.getElementById('touch-left').addEventListener('touchstart', (e)=>{e.preventDefault(); moveLeft();});
  document.getElementById('touch-right').addEventListener('touchstart', (e)=>{e.preventDefault(); moveRight();});
  document.getElementById('touch-left').addEventListener('click', moveLeft);
  document.getElementById('touch-right').addEventListener('click', moveRight);

  // ---------- Bots ----------
  const BOT_COLORS = ['#F4C430','#8A93A6','#FF3D68','#5B7FDE','#E0E0E0','#37E6C4'];
  function spawnBot(){
    const lane = Math.floor(Math.random()*LANES);
    // avoid stacking two bots too close in same lane
    const tooClose = bots.some(b => b.lane === lane && b.y < carH()*2.2);
    if(tooClose) return;
    const variance = 0.85 + Math.random()*0.3;
    bots.push({
      lane,
      x: laneCenters[lane],
      y: -carH(),
      speed: speed * diff.botSpeedFactor * variance,
      color: BOT_COLORS[Math.floor(Math.random()*BOT_COLORS.length)],
      passed: false
    });
  }

  // ---------- Drawing helpers ----------
  function drawCar(x, y, color, isPlayer){
    const w = carW(), h = carH();
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, h*0.42, w*0.48, h*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    // body
    ctx.fillStyle = color;
    roundRect(-w/2, -h/2, w, h, w*0.28);
    ctx.fill();
    // windshield
    ctx.fillStyle = 'rgba(11,15,25,0.7)';
    roundRect(-w*0.32, -h*0.28, w*0.64, h*0.28, w*0.14);
    ctx.fill();
    // rear window
    roundRect(-w*0.30, h*0.06, w*0.60, h*0.2, w*0.12);
    ctx.fill();
    // stripe
    if(isPlayer){
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(-w*0.06, -h*0.46, w*0.12, h*0.92);
    }
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawRoad(){
    // background (grass/side)
    ctx.fillStyle = '#0B0F19';
    ctx.fillRect(0,0,W,H);

    // asphalt
    ctx.fillStyle = '#20263A';
    ctx.fillRect(roadLeft, 0, roadWidth, H);

    // side shoulders
    ctx.fillStyle = 'rgba(244,196,48,0.15)';
    ctx.fillRect(roadLeft-6, 0, 6, H);
    ctx.fillRect(roadRight, 0, 6, H);

    // lane dashed lines
    ctx.strokeStyle = 'rgba(244,196,48,0.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([28, 26]);
    const laneW = roadWidth / LANES;
    for(let i=1;i<LANES;i++){
      const x = roadLeft + laneW*i;
      ctx.beginPath();
      ctx.lineDashOffset = -scrollY;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // speed streak side markers for feel
    ctx.strokeStyle = 'rgba(55,230,196,0.18)';
    ctx.lineWidth = 3;
    ctx.setLineDash([40,40]);
    ctx.lineDashOffset = -scrollY*1.4;
    ctx.beginPath();
    ctx.moveTo(roadLeft-16,0); ctx.lineTo(roadLeft-16,H);
    ctx.moveTo(roadRight+16,0); ctx.lineTo(roadRight+16,H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // ---------- Main loop ----------
  let lastTime = null;
  function loop(ts){
    if(lastTime === null) lastTime = ts;
    const dt = Math.min(ts - lastTime, 40); // ms, clamp for tab-switch spikes
    lastTime = ts;

    if(state === 'playing') update(dt);
    drawRoad();
    if(state === 'playing' || state === 'gameover'){
      for(const b of bots) drawCar(b.x, b.y, b.color, false);
      drawCar(player.x, player.y, player.color, true);
    }
    requestAnimationFrame(loop);
  }

  function update(dt){
    elapsedMs += dt;
    // ramp speed up over time
    speed += diff.speedRamp * dt * (speed);
    speed = Math.min(speed, diff.baseSpeed * 5.5);

    // smooth lane change
    player.x += (player.targetX - player.x) * Math.min(1, dt/90);

    // scroll & distance
    const distDelta = (speed * dt) / 1000; // arbitrary units per second
    distance += distDelta;
    scrollY += distDelta * 1.4;

    // spawn bots
    spawnTimer += dt;
    const interval = Math.max(diff.spawnInterval - elapsedMs*0.02, diff.spawnInterval*0.35);
    if(spawnTimer > interval){
      spawnTimer = 0;
      spawnBot();
    }

    // update bots
    for(const b of bots){
      const rel = (speed - b.speed) * dt / 1000;
      b.y += rel;
    }
    // remove passed bots, count overtakes
    for(let i=bots.length-1;i>=0;i--){
      if(bots[i].y > H + carH()){
        bots.splice(i,1);
        overtakes++;
      }
    }

    // collision check
    const pw = carW()*0.78, ph = carH()*0.8;
    for(const b of bots){
      if(b.lane !== player.lane) continue;
      const bw = carW()*0.78, bh = carH()*0.8;
      if(Math.abs(b.x - player.x) < (pw+bw)/2 && Math.abs(b.y - player.y) < (ph+bh)/2){
        crash();
        break;
      }
    }

    // HUD
    document.getElementById('hud-distance').textContent = Math.floor(distance) + ' m';
    document.getElementById('hud-speed').textContent = Math.floor(speed*0.9) + ' km/s';
  }

  function crash(){
    state = 'gameover';
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('touch-controls').classList.add('hidden');
    document.getElementById('footer-hint').classList.add('hidden');

    const score = Math.floor(distance + overtakes*45);
    document.getElementById('crash-name-sub').textContent = playerName + ' pistten çıktı — ' + diff.label + ' modu';
    document.getElementById('final-distance').textContent = Math.floor(distance) + ' m';
    document.getElementById('final-overtakes').textContent = overtakes;
    document.getElementById('final-score').textContent = score;

    sessionBoard.push({name: playerName, score, diff: diff.label});
    sessionBoard.sort((a,b)=> b.score - a.score);
    sessionBoard = sessionBoard.slice(0,5);

    const lbList = document.getElementById('lb-list');
    lbList.innerHTML = '';
    sessionBoard.forEach((entry, idx)=>{
      const row = document.createElement('div');
      row.className = 'lb-item' + (entry.name===playerName && entry.score===score ? ' me':'');
      row.innerHTML = `<span>${idx+1}. ${escapeHtml(entry.name)} · ${entry.diff}</span><span>${entry.score}</span>`;
      lbList.appendChild(row);
    });

    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- UI wiring ----------
  const diffButtons = document.querySelectorAll('.diff-btn');
  diffButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      diffButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      difficultyKey = btn.dataset.diff;
    });
  });

  const nameInput = document.getElementById('name-input');
  document.getElementById('start-btn').addEventListener('click', startGame);
  nameInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') startGame(); });

  function startGame(){
    const val = nameInput.value.trim();
    playerName = val.length ? val.slice(0,14) : 'Pilot';
    diff = DIFFS[difficultyKey];
    resetGame();
    state = 'playing';

    document.getElementById('menu-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('hud-name').textContent = playerName + ' · ' + diff.label;
    document.getElementById('footer-hint').classList.remove('hidden');
    if(window.matchMedia('(max-width: 820px)').matches){
      document.getElementById('touch-controls').classList.remove('hidden');
    }
  }

  document.getElementById('retry-btn').addEventListener('click', ()=>{
    diff = DIFFS[difficultyKey];
    resetGame();
    state = 'playing';
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('footer-hint').classList.remove('hidden');
    if(window.matchMedia('(max-width: 820px)').matches){
      document.getElementById('touch-controls').classList.remove('hidden');
    }
  });

  document.getElementById('menu-btn').addEventListener('click', ()=>{
    state = 'menu';
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
  });

  // kick off render loop (menu shows static empty road behind card)
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
